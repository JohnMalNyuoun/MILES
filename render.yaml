services:
  - type: web
    name: miles-integrated
    runtime: node
    rootDir: .
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OFFICIAL_MILES_EMAIL
        sync: false
      - key: MILES_REGISTRATION_SECRET
        sync: false
      - key: ADMIN_REGISTRATION_SECRET
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

services:
  - type: web
    name: miles-backend
    runtime: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_REGISTRATION_SECRET
        sync: false

  - type: web
    name: miles-website
    env: static
    rootDir: .
    buildCommand: npm --prefix Frontend/MILES install && npm --prefix Frontend/MILES run build
    staticPublishPath: Frontend/MILES/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE_URL
        value: https://miles-backend.onrender.com
